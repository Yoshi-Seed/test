<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="凪">
<meta name="description" content="波のある日も、静かな日も。自分のペースで残す、プライベートな記録。">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<title>凪 · NAGI</title>
</head>
<body>
<div id="app">
  <header class="boot"><span class="brand-kanji">凪</span><p>あなたのペースで。</p></header>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="cover" aria-label="プライバシーカバー">
  <div class="cover-orb" aria-hidden="true"></div><span class="cover-brand">凪</span>
  <p>少し、ひと休み。</p><button id="uncover" class="btn cover-btn">記録に戻る</button>
  <small>画面を隠しています。認証ロックではありません。</small>
</dialog>
<div id="print-root"></div>
<noscript>このアプリにはJavaScriptが必要です。Safariの設定をご確認ください。</noscript>
